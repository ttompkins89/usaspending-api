# Weekly refresh: regenerate the committed data (contracts, tokens, release notes, changelog,
# glossary, data dictionary) and commit it if anything changed. The push redeploys the site on Vercel.
name: Refresh generated data

on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate
        run: |
          npm run tokens
          npm run docs
          npm run resources
      - name: Commit if changed
        run: |
          git add lib tokens app/tokens.css
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh generated data"
            git push
          else
            echo "No content changes."
          fi
