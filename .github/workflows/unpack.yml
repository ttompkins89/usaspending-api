name: Unpack bootstrap

on:
  push:
    branches: [main]
    paths: [bootstrap.jsonl]

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write files, verify checksums, apply deletions
        run: |
          node -e '
          const fs = require("fs"), path = require("path"), crypto = require("crypto");
          const lines = fs.readFileSync("bootstrap.jsonl", "utf8").split("\n").filter(Boolean);
          const head = JSON.parse(lines[0]);
          let n = 0;
          for (const l of lines.slice(1)) {
            const { p, c } = JSON.parse(l);
            if (p.startsWith(".github/") || p.split("/").includes("..")) throw new Error("refused path " + p);
            const h = crypto.createHash("sha256").update(c, "utf8").digest("hex").slice(0, 16);
            if (h !== head.manifest[p]) throw new Error("checksum mismatch " + p);
            fs.mkdirSync(path.dirname(p), { recursive: true });
            fs.writeFileSync(p, c);
            n++;
          }
          if (n !== Object.keys(head.manifest).length) throw new Error("expected " + Object.keys(head.manifest).length + " files, got " + n);
          fs.writeFileSync("/tmp/deletions", (head.delete || []).join("\n"));
          console.log("wrote", n, "files");
          '
          while IFS= read -r f; do [ -n "$f" ] && [ -e "$f" ] && git rm -q -- "$f" || true; done < /tmp/deletions
          git rm -q bootstrap.jsonl
      - name: Commit
        run: |
          git config user.name "Tanika Tompkins"
          git config user.email "ttompkins89@users.noreply.github.com"
          git add -A
          git commit -q -F - <<'MSG'
          v2: docs shell on usaspending.gov tokens, guides, release notes, changelog, glossary, data dictionary

          Rebuilds the site as USAspending API Reference: tokens generated from the site's
          _variables.scss with light and dark themes, left sub-navigation, on-this-page rail,
          accordion endpoint rows with cURL, Python, and JavaScript samples, and search.
          Adds guides that trace site pages call by call, release notes from the site's
          Release Log, an API changelog from contract history, and the glossary and data
          dictionary from the API. Upgrades to Next.js 15 and React 19.

          Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01N8vxSuJdJvQFGw3ybpvr3r
          MSG
          git push
