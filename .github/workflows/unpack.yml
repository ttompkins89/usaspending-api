name: Unpack bundle
on:
  push:
    paths:
      - bootstrap.jsonl
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write files from bootstrap.jsonl and verify checksums
        run: |
          node -e '
          const fs = require("fs"), path = require("path"), crypto = require("crypto");
          const lines = fs.readFileSync("bootstrap.jsonl", "utf8").split("\n").filter((l) => l.trim());
          const man = JSON.parse(lines[0]).manifest;
          const bad = [];
          lines.slice(1).forEach((l, i) => {
            let rec;
            try { rec = JSON.parse(l); } catch (e) { console.log("PARSE ERROR on line", i + 2, e.message, l.slice(0, 80)); process.exit(1); }
            fs.mkdirSync(path.dirname(rec.p), { recursive: true });
            fs.writeFileSync(rec.p, rec.c);
            const h = crypto.createHash("sha256").update(rec.c).digest("hex").slice(0, 16);
            if (h !== man[rec.p]) bad.push(rec.p);
          });
          const missing = Object.keys(man).filter((p) => !fs.existsSync(p));
          if (bad.length || missing.length) { console.log("MISMATCH", JSON.stringify(bad), "MISSING", JSON.stringify(missing)); process.exit(1); }
          console.log("OK", lines.length - 1, "files");
          '
          git rm -q bootstrap.jsonl
          git config user.name "Tanika Tompkins"
          git config user.email "ttompkins89@users.noreply.github.com"
          git add -A
          git commit -m "Tally: USAspending API docs, Phase 1" -m "Generator from API Blueprint contracts, feature map to usaspending.gov, reference for every endpoint, live console proxy, start here and filter pages." -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_01N8vxSuJdJvQFGw3ybpvr3r"
          git push
